[project]
name = "anneal-run"
version = "0.0.1"
description = "Prove a cheaper or more correct architecture for an agent workflow on a holdout."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Anneal", email = "hello@anneal.run" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "blake3>=1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langgraph = ["langchain-core>=1.6"]

[project.urls]
Homepage = "https://anneal.run"

[project.scripts]
anneal = "anneal.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "langchain-core>=1.6.10",
    "langgraph>=1.2.15",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
examples = [
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.1",
]

[tool.uv]
default-groups = ["dev", "examples"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anneal"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["baseline"]  # the handwritten arm is judged on behaviour, not our style

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "examples"]
mypy_path = "tests:examples"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "examples"]
addopts = "--cov=anneal --cov-report=term-missing"
