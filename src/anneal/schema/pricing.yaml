# USD per 1M tokens, standard (non-batch) API rates.
# input: uncached input; cached_input: prompt-cache reads; output: output tokens.
# long_context: when a request's input tokens exceed over_input_tokens, the
# whole request is billed at those rates.
# Not modelled: cache-write surcharges, batch and priority tiers.
# Edit freely; anneal never fetches prices from the network.
as_of: 2026-10-12
