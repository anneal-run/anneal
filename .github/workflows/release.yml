name: release

# Publishes anneal-run to PyPI via trusted publishing (OIDC); no stored token.
# Trigger: push a tag vX.Y.Z matching the version in pyproject.toml.
# The `pypi` environment is the trusted publisher's environment on PyPI and
# can require a reviewer in GitHub before the publish job runs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: make setup
      - run: make check
      - name: Tag matches pyproject version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anneal-run/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - run: uv publish --trusted-publishing always
